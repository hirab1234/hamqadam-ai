# The full stack: API, worker, vector store, cache, broker, monitoring.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# Bring it up the first time with a warm model volume, or the API will spend
# several minutes downloading weights before /ready turns green. That is
# expected on a cold start and is why the healthcheck has a 180 s start period.

name: hamqadam-ai

x-ai-environment: &ai-environment
  HQ_APP__ENVIRONMENT: production
  # NOT HQ_MODELS__CACHE_DIR: `models` is a real dict section, so that name
  # does not merely get ignored - it fails validation and the container
  # never starts.
  HQ_STORAGE__MODEL_DIR: /models
  # These names must match the settings tree exactly. An unrecognised
  # HQ_-prefixed variable is **ignored, not rejected**, so a wrong name is
  # silent: an earlier draft of this file set HQ_DUPLICATE__STORE__BACKEND,
  # HQ_CACHE__BACKEND and friends, none of which exist. The stack came up
  # looking healthy while running an in-memory gallery that lost every enrolled
  # template on restart and was not shared between replicas.
  #
  # Verify a rename against the real tree, not against this file:
  #   python -c "from hamqadam_ai.core.config import Settings; print(list(Settings.model_fields))"
  HQ_DUPLICATE__BACKEND: qdrant
  HQ_DUPLICATE__QDRANT__URL: http://qdrant:6333
  HQ_DUPLICATE__QDRANT__COLLECTION: hamqadam_faces
  # on_approve | unless_rejected. See configs/app.production.yaml - the
  # second also enrols reviewed applicants, which closes the multi-account
  # hole but stores a template for someone not yet approved.
  HQ_DUPLICATE__ENROL_POLICY: ${HQ_ENROL_POLICY:-on_approve}
  # manual_review | reject
  HQ_DUPLICATE__ON_DUPLICATE: ${HQ_ON_DUPLICATE:-manual_review}
  HQ_EMBEDDING__CACHE__BACKEND: redis
  # Read directly from the environment by the cache adapter rather than through
  # the settings tree, which is why it has no HQ_EMBEDDING__ prefix.
  HQ_REDIS__URL: redis://redis:6379/0
  HQ_QUEUE__URL: amqp://hamqadam:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672/
  # Secrets come from the environment, never from a committed file. The `:?`
  # form fails the compose run with a named variable rather than starting a
  # service that silently accepts every request.
  #
  # One key or several, comma-separated - `HQ_API_KEYS=key-a,key-b`. Several is
  # what makes rotation possible: both the old and the new key are accepted
  # during the overlap, so callers can move across without a coordinated cutover.
  HQ_SECURITY__API_KEYS: ${HQ_API_KEYS:?set HQ_API_KEYS}
  HQ_SECURITY__REQUIRE_API_KEY: "true"

services:
  # Populates the shared `models` volume before anything that needs weights
  # starts. Runs once and exits.
  #
  # Without this the stack comes up broken on a fresh host, and it does so
  # *quietly*: `docker compose up` reported api "healthy" because /health is a
  # liveness probe, while /ready returned 503 and the worker crash-looped on
  # ModelNotLoadedError. The volume was simply empty - nothing in the stack ever
  # downloaded the weights, and the Dockerfile deliberately does not bake them
  # in (several hundred megabytes in every layer makes each deploy slow and
  # every rollback expensive).
  #
  # `service_completed_successfully` on the dependents is what makes this a
  # gate rather than a race: api and worker do not start until this has exited 0.
  model-init:
    image: hamqadam/ai-verification:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: "no"
    command: ["python", "scripts/download_models.py"]
    environment: *ai-environment
    volumes:
      - models:/models
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hamqadam/ai-verification:latest
    restart: unless-stopped
    environment: *ai-environment
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - models:/models
    tmpfs:
      # Temporary image work goes to RAM. An identity document written to a
      # container's writable layer survives in the layer after the request that
      # created it, which is exactly what the retention policy forbids.
      - /tmp/hamqadam:size=512m,mode=1700
    depends_on:
      # Weights first, or the API starts, reports /health 200, and serves 503 on
      # /ready forever.
      model-init: {condition: service_completed_successfully}
      # service_healthy now that Qdrant is the mandatory store. It used to be
      # service_started, which was right while the gallery was optional and is
      # wrong now: `allow_memory_fallback` is false, so an API that starts
      # before Qdrant answers does not degrade - it refuses to start at all.
      qdrant: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3
    deploy:
      resources:
        limits: {cpus: "4.0", memory: 6G}
        reservations: {cpus: "2.0", memory: 3G}
    security_opt:
      - no-new-privileges:true

  worker:
    image: hamqadam/ai-verification:latest
    restart: unless-stopped
    command: ["python", "-m", "hamqadam_ai.workers"]
    environment: *ai-environment
    volumes:
      - models:/models
    tmpfs:
      - /tmp/hamqadam:size=512m,mode=1700
    # The worker serves no HTTP, so it cannot answer the image's healthcheck -
    # which curls http://localhost:8000/health and belongs to the API. Inherited
    # unchanged it marked both replicas `(unhealthy)` forever while they were
    # consuming happily, and under an orchestrator that acts on health it would
    # be a restart loop around a working process.
    #
    # Disabled rather than replaced with something cosmetic. Liveness here is
    # real: the consumer exits non-zero when it cannot build its pipeline or
    # reach the broker - which is exactly what it did when the models volume was
    # empty - and `restart: unless-stopped` handles that.
    healthcheck:
      disable: true
    depends_on:
      model-init: {condition: service_completed_successfully}
      api: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    deploy:
      # Scale this, not uvicorn's --workers: each replica is a separate process
      # with its own model copy either way, and replicas can be scheduled onto
      # different hosts.
      replicas: 2
      resources:
        limits: {cpus: "4.0", memory: 6G}
    security_opt:
      - no-new-privileges:true

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    environment:
      # Structured logs so the container's output is greppable alongside the
      # API's own JSON.
      QDRANT__LOG_LEVEL: INFO
      QDRANT__SERVICE__HTTP_PORT: 6333
    volumes:
      # The named volume is what makes the gallery survive `docker compose down`
      # and a VPS reboot. Remove it and every enrolled template is gone - which
      # is precisely the in-memory failure this backend exists to avoid.
      - qdrant:/qdrant/storage
    # No published port. The gallery holds biometric templates; it is reachable
    # from the compose network and nowhere else.
    expose:
      - "6333"
    healthcheck:
      # The image carries no curl and no wget, so the probe uses bash's own
      # /dev/tcp redirection - available because the image is Debian-based.
      # Checking the port answers is enough: the API creates its collection on
      # connect, so "listening" is the readiness condition that matters.
      test: ["CMD-SHELL", "bash -c '>/dev/tcp/127.0.0.1/6333' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 512mb
      # Eviction rather than refusal. The cache is an optimisation; a full
      # Redis that starts returning errors would turn a cache into an outage.
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: hamqadam
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    expose:
      - "5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:9090:9090"
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true

volumes:
  models:
  qdrant:
  rabbitmq:
  prometheus:
  grafana:
