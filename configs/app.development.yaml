# Development overlay.
#
# Loaded ONLY when app.environment is "development" - the loader reads
# `app.<environment>.yaml` and merges it over app.yaml. Nothing here can reach a
# production process, because a production process reads app.production.yaml
# instead, and the production hardening validator refuses to start if any of
# these values did somehow arrive.
#
# The point of this file is that `uvicorn ... --factory` should work from a fresh
# clone. Before it existed, the shipped defaults had require_api_key: true with
# an empty key list, so every authenticated request failed - correctly, but with
# nothing in the documentation or the error to say which key to send.

security:
  # A well-known, non-secret local key. Safe to commit *because* it only ever
  # loads in development, and because a production deployment that reached this
  # file would still be refused by the hardening check.
  #
  # Paste this into Swagger's Authorize dialog at http://127.0.0.1:8000/docs
  api_keys:
    - dev-key-123

  # Authentication stays ON in development. Turning it off locally would mean
  # the auth path never runs until staging, which is how a broken security
  # header ships - it is exactly how the missing Authorize button survived this
  # long.
  require_api_key: true

  rate_limit:
    # Generous locally. A developer clicking "Execute" in Swagger repeatedly is
    # not an attacker, and a 429 in the middle of manual testing wastes time
    # working out whether the code or the limiter refused the call.
    enabled: true
    requests_per_minute: 600
    analyze_requests_per_minute: 120
    burst: 60

# The admin inspection routes are deliberately NOT enabled here.
#
#   GET    /admin/qdrant/count
#   GET    /admin/qdrant/list?limit=50&offset=0
#   GET    /admin/qdrant/{reference}
#   DELETE /admin/qdrant/{reference}
#
# Setting `admin: {enabled: true}` in this file looks right and is wrong. The
# loader picks the overlay from the *ambient* environment, so this file is
# merged whenever HQ_APP__ENVIRONMENT is unset - including when something then
# constructs a production Settings explicitly, which is exactly what validating
# a production config from a developer machine does. The value would survive the
# merge, the hardening validator would see admin.enabled with
# environment=production, and it would refuse to build a config that is in fact
# correct. `test_hardened_production_config_is_accepted` catches this.
#
# Turn them on per shell instead, so the flag lives for one process and cannot
# leak into anything that constructs a production config:
#
#   PowerShell:  $env:HQ_ADMIN__ENABLED = "true"
#   bash:        HQ_ADMIN__ENABLED=true uvicorn ...
