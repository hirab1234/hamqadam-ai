# =========================================================================== #
# Hamqadam AI Verification Service - application configuration.
#
# Layering order (later wins):
#   1. Defaults hard-coded in `hamqadam_ai.core.config`
#   2. configs/app.yaml            (this file)
#   3. configs/app.<environment>.yaml
#   4. Environment variables prefixed HQ_  (double underscore = nesting)
#      e.g.  HQ_SERVER__PORT=9000   HQ_SECURITY__API_KEYS=key1,key2
# =========================================================================== #

app:
  name: hamqadam-ai-verification
  # Semantic version of the *service contract*, surfaced in every response.
  version: "1.0.0"
  environment: development          # development | staging | production
  debug: false
  # Human-readable identifier of this deployment, echoed in health checks.
  instance_id: null                 # null -> derived from hostname

server:
  host: 0.0.0.0
  port: 8000
  # Uvicorn workers. Keep at 1 when running under Gunicorn/Kubernetes and
  # scale horizontally instead - ONNX sessions are per-process and memory heavy.
  workers: 1
  root_path: ""
  # Hard ceiling for a single synchronous /analyze call. The pipeline raises
  # PROCESSING_TIMEOUT past this and returns a partial, auditable result.
  request_timeout_seconds: 45.0
  # Maximum decoded request body (all images combined).
  max_request_bytes: 41943040       # 40 MiB
  cors:
    enabled: true
    # Backend origins only. Never "*" in production - enforced at startup.
    allow_origins: ["http://localhost:3000", "http://localhost:8080"]
    allow_credentials: false
    allow_methods: ["GET", "POST"]
    allow_headers: ["*"]

security:
  # Static API keys are the baseline mechanism; rotate via env, never commit.
  api_key_header: X-API-Key
  api_keys: []                      # populated from HQ_SECURITY__API_KEYS
  # When true an unauthenticated request is rejected with 401 before any I/O.
  require_api_key: true
  # HMAC request signing (optional second factor for backend->AI traffic).
  hmac:
    enabled: false
    header: X-Signature
    timestamp_header: X-Timestamp
    secret: null
    max_clock_skew_seconds: 300
  rate_limit:
    enabled: true
    # Token bucket per API key. Redis-backed when available, in-process fallback.
    requests_per_minute: 120
    burst: 30
    # Separate, tighter bucket for the expensive /analyze endpoint.
    analyze_requests_per_minute: 40
  # Refuse to boot in production with insecure settings.
  enforce_production_hardening: true

storage:
  # Images are NEVER persisted. Everything lands in a per-request scratch dir
  # that is shredded in a `finally` block, plus a janitor sweep for crashes.
  temp_dir: null                    # null -> system temp / hamqadam-ai
  # Age after which the janitor deletes an orphaned scratch directory.
  temp_ttl_seconds: 300
  janitor_interval_seconds: 60
  # Overwrite file bytes before unlinking (defence-in-depth for CNIC images).
  secure_delete: true
  # Directory holding downloaded model weights (read-only at runtime).
  model_dir: ./model_store

runtime:
  # auto | cpu | cuda | tensorrt | directml | coreml
  device: auto
  # Preferred CUDA device ordinal when several are present.
  gpu_device_id: 0
  # ONNX Runtime intra/inter-op threads. 0 -> let ORT decide from cpu_count.
  intra_op_threads: 0
  inter_op_threads: 1
  # ORT graph optimisation: disable_all | basic | extended | all
  graph_optimization_level: all
  # Run a synthetic forward pass per model at startup so the first real
  # request does not pay allocator + kernel-autotune cost.
  warmup_on_startup: true
  warmup_iterations: 2
  # Bounded thread pool that hosts blocking ONNX calls off the event loop.
  inference_workers: 4
  # Max images coalesced into one forward pass.
  max_batch_size: 8

observability:
  metrics:
    enabled: true
    path: /metrics
    # Latency histogram buckets in seconds, tuned for a 0.2-15 s pipeline.
    latency_buckets: [0.05, 0.1, 0.25, 0.5, 1.0, 2.0, 3.0, 5.0, 8.0, 13.0, 21.0]
  tracing:
    enabled: false
    otlp_endpoint: null
    sample_ratio: 0.05
  mlflow:
    enabled: false
    tracking_uri: null
    experiment: hamqadam-ai-verification
  health:
    # Readiness fails until every model marked `required` has loaded.
    startup_grace_seconds: 120
